<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- SwitchOS · "Três vias, emoldurado" (S6): PC, nuvem e Android nos vértices, o save no centro,
       dentro do contorno de seleção do hub. Fonte única do ícone: o Tauri gera .ico/.icns/PNGs daqui
       (npx tauri icon app-icon.svg) e o Android usa as mesmas medidas (res/drawable/ic_launcher_*). -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2a3d"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.2" r="0.85"><stop offset="0" stop-color="#3f6db0" stop-opacity="0.85"/><stop offset="1" stop-color="#3f6db0" stop-opacity="0"/></radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8af3f1"/><stop offset="1" stop-color="#2fb7d6"/></linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#night)"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="15" y="15" width="70" height="70" rx="18.5" fill="none" stroke="url(#cyan)" stroke-width="4.4"/>
  <path d="M50 30 L70.5 65 L29.5 65 Z" fill="none" stroke="#eef1f6" stroke-opacity="0.55" stroke-width="4.6" stroke-linejoin="round"/>
  <circle cx="50" cy="53.4" r="7.6" fill="url(#cyan)"/>
  <circle cx="50" cy="30" r="8.2" fill="#eef1f6"/>
  <circle cx="70.5" cy="65" r="8.2" fill="#eef1f6"/>
  <circle cx="29.5" cy="65" r="8.2" fill="#eef1f6"/>
</svg>
